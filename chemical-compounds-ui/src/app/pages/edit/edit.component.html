<div class="max-w-xl mx-auto p-6">
  <h2 class="text-2xl font-bold mb-4">Edit Compound</h2>

  <input class="input input-bordered w-full mb-3" [(ngModel)]="form.name" placeholder="Name" />
  <input class="input input-bordered w-full mb-3" [(ngModel)]="form.image" placeholder="Image URL" />
  <textarea class="textarea textarea-bordered w-full mb-3" [(ngModel)]="form.description"></textarea>

  <button class="btn btn-success w-full" (click)="submit()">Save</button>
</div>
